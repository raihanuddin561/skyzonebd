# Nginx Site Configuration for SkyzoneBD
# File Location on VPS: /etc/nginx/sites-available/skyzonebd
# Symlink: ln -s /etc/nginx/sites-available/skyzonebd /etc/nginx/sites-enabled/
# Upstream Application: Next.js running on Port 3001
# Note: Kuttush runs on Port 3000 and is completely separate.

# Rate limiting zone for API security
limit_req_zone $binary_remote_addr zone=skyzone_api:10m rate=30r/s;

# Upstream definition for SkyzoneBD
upstream skyzonebd_upstream {
    server 127.0.0.1:3001;
    keepalive 32;
}

# HTTP — Redirect all HTTP traffic to HTTPS (Enabled after SSL certificate is issued)
server {
    listen 80;
    listen [::]:80;
    server_name skyzonebd.shop www.skyzonebd.shop;

    # Allow Let's Encrypt ACME challenge verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — Production Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name skyzonebd.shop www.skyzonebd.shop;

    # SSL Certificates (Managed by Certbot)
    # certbot --nginx -d skyzonebd.shop -d www.skyzonebd.shop
    ssl_certificate /etc/letsencrypt/live/skyzonebd.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/skyzonebd.shop/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max upload size (50MB for bulk wholesale catalogs and image uploads)
    client_max_body_size 50M;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Access & Error Logs
    access_log /var/log/nginx/skyzonebd_access.log;
    error_log /var/log/nginx/skyzonebd_error.log warn;

    # Next.js Static Assets Caching (1 year immutable cache)
    location /_next/static/ {
        proxy_pass http://skyzonebd_upstream;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js Public Static Files Caching
    location /public/ {
        proxy_pass http://skyzonebd_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Main Reverse Proxy Location
    location / {
        proxy_pass http://skyzonebd_upstream;
        proxy_http_version 1.1;

        # WebSocket & Upgrade Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for wholesale batch processes
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering for performance
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Rate limiting on sensitive API auth endpoints
    location /api/auth/ {
        limit_req zone=skyzone_api burst=20 nodelay;
        proxy_pass http://skyzonebd_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

